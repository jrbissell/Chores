function logError(msg, detail=''){
  const entry={time:new Date().toLocaleTimeString(),msg,detail:String(detail)};
  dbgLog.unshift(entry);
  if(dbgLog.length>50) dbgLog.pop();
  showErrToast(msg);

}

}

// ============================================================
//  DATE HELPERS
// ============================================================
function localDate(d){ return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function p2(n){ return String(n).padStart(2,'0'); }
function dateLabel(s){
  if(s===localDate(new Date())) return 'Today';
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function shiftDate(s,n){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return localDate(dt); }
function nextDate(s,type,val){
  const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d);
  if(type==='daily')                dt.setDate(dt.getDate()+1);
  else if(type==='weekly')          dt.setDate(dt.getDate()+7);
  else if(type==='monthly')         dt.setMonth(dt.getMonth()+1);
  else if(type==='yearly')          dt.setFullYear(dt.getFullYear()+1);
  else if(type==='interval_days')   dt.setDate(dt.getDate()+(val?.interval||1));
  else if(type==='interval_weeks')  dt.setDate(dt.getDate()+(val?.interval||1)*7);
  else if(type==='interval_months') dt.setMonth(dt.getMonth()+(val?.interval||1));
  return localDate(dt);
}
function repLabel(type,val){
  if(!type||type==='none') return '';
  if(type==='daily') return 'Daily';
  if(type==='weekly') return `Every ${DAYS[val?.dayOfWeek??0]}`;
  if(type==='monthly'){ const n=val?.dayOfMonth||1; const s=['st','nd','rd'][((n+9)%10)-1]||'th'; return `Monthly · ${n}${s}`; }
  if(type==='yearly') return `Yearly · ${MONTHS[val?.monthOfYear??0]}`;
  if(type==='interval_days')   return `Every ${val?.interval} days`;
  if(type==='interval_weeks')  return `Every ${val?.interval} weeks`;
  if(type==='interval_months') return `Every ${val?.interval} months`;
  return type;
}

async function loadAll(){
  try {
    const [c,g,f]=await Promise.all([
      sb.from('chores').select('*').order('created_at'),
      sb.from('grocery_items').select('*').order('created_at'),
      sb.from('favorite_items').select('*').order('created_at')
    ]);
    if(c.error) throw new Error('chores: '+c.error.message);
    if(g.error) throw new Error('grocery_items: '+g.error.message);
    if(f.error) throw new Error('favorite_items: '+f.error.message);
    chores=c.data||[]; groceries=g.data||[]; favs=f.data||[];
    syncStores();
    await autoMoveOverdue();
    render();
  } catch(err){ logError('Load failed', err.message); render(); }
}
function syncStores(){
  const custom=groceries.map(i=>i.store).filter(s=>s&&!DEFAULT_STORES.includes(s));
  stores=[...DEFAULT_STORES,...new Set(custom)];
}
async function autoMoveOverdue(){
  const today=localDate(new Date());
  // Only auto-move one-time (none) chores — repeating chores stay on their scheduled date
  const overdue=chores.filter(x=>!x.is_completed&&x.due_date<today&&(!x.repetition_type||x.repetition_type==='none'));
  for(const c of overdue){
    const {error}=await sb.from('chores').update({due_date:today}).eq('id',c.id);
    if(error) logError('Auto-move failed',error.message);
    else c.due_date=today;
  }
}

// ============================================================
async function toggleChore(id){
  const c=chores.find(x=>x.id===id); if(!c) return;
  try {
    if(!c.is_completed&&c.repetition_type&&c.repetition_type!=='none'){
      const orig=c.due_date, nxt=nextDate(c.due_date,c.repetition_type,c.repetition_value);
      const {error}=await sb.from('chores').update({due_date:nxt}).eq('id',id);
      if(error) throw error;
      c.due_date=nxt;
      showToast(`Moved to ${dateLabel(nxt)}`, async()=>{
        const {error:e2}=await sb.from('chores').update({due_date:orig}).eq('id',id);
        if(e2) logError('Undo failed',e2.message); else { c.due_date=orig; render(); }
      });
    } else {
      const nv=!c.is_completed;
      const {error}=await sb.from('chores').update({is_completed:nv}).eq('id',id);
      if(error) throw error;
      c.is_completed=nv;
    }
    render();
  } catch(err){ logError('Toggle chore failed', err.message); }
}

async function deleteChore(id){
  try {
    const {error}=await sb.from('chores').delete().eq('id',id);
    if(error) throw error;
    chores=chores.filter(x=>x.id!==id); render();
  } catch(err){ logError('Delete chore failed', err.message); }
}

async function saveChore(data){
  try {
    if(data.id){
      const {error}=await sb.from('chores').update({
        title:data.title, description:data.description,
        repetition_type:data.repetition_type, repetition_value:data.repetition_value
      }).eq('id',data.id);
      if(error) throw error;
      const i=chores.findIndex(x=>x.id===data.id); if(i>=0) chores[i]={...chores[i],...data};
    } else {
      const {data:row,error}=await sb.from('chores').insert({
        title:data.title, description:data.description, person,
        is_completed:false, due_date:selDate,
        repetition_type:data.repetition_type, repetition_value:data.repetition_value
      }).select().single();
      if(error) throw error;
      if(row) chores.push(row);
    }
    render();
  } catch(err){ logError('Save chore failed', err.message); }
}

let krogerToken=null, krogerTokenExp=0;
async function getKrogerToken(){
  if(krogerToken && Date.now()<krogerTokenExp) return krogerToken;
  const creds=btoa(KROGER_CLIENT_ID+':'+KROGER_CLIENT_SECRET);
  const res=await fetch('https://api.kroger.com/v1/connect/oauth2/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded','Authorization':'Basic '+creds},
    body:'grant_type=client_credentials&scope=product.compact'
  });
  if(!res.ok) throw new Error('Kroger auth failed: '+res.status);
  const data=await res.json();
  krogerToken=data.access_token;
  krogerTokenExp=Date.now()+(data.expires_in-60)*1000;
  return krogerToken;
}

// --- Kroger Product Search ---
async function getKrogerPrice(item){
  try {
    const token=await getKrogerToken();
    const q=encodeURIComponent([item.name, item.brand, item.size].filter(Boolean).join(' '));
    const res=await fetch(`https://api.kroger.com/v1/products?filter.term=${q}&filter.locationId=70100119&filter.limit=5`,{
      headers:{'Authorization':'Bearer '+token,'Accept':'application/json'}
    });
    if(!res.ok) throw new Error('Kroger products API: '+res.status);
    const data=await res.json();
    const products=data.data||[];
    if(!products.length) return {store:'Kroger',price:null,found:false};

    // Find the product with a price — prefer exact brand match if brand specified
    const hasBrand=!!(item.brand&&item.brand.trim());
    let best=null;
    for(const p of products){
      const hasPrice=p.items?.[0]?.price?.regular||p.items?.[0]?.price?.promo;
      if(!hasPrice) continue;
      if(hasBrand){
        const brandMatch=(p.brand||'').toLowerCase().includes(item.brand.toLowerCase());
        if(brandMatch){ best=p; break; }
      } else {
        best=p; break; // take first priced result
      }
    }
    if(!best && hasBrand){
      // Brand not found at Kroger
      return {store:'Kroger',price:null,found:false,brandNotFound:true};
    }
    if(!best) return {store:'Kroger',price:null,found:false};

    const priceVal=best.items?.[0]?.price?.promo||best.items?.[0]?.price?.regular;
    return {store:'Kroger',price:priceVal?.toFixed(2)||null,found:!!priceVal};
  } catch(err){
    logError('Kroger API error',err.message);
    return {store:'Kroger',price:null,found:false,error:err.message};
  }
}

// --- Walmart via Claude Haiku ---
async function getWalmartPrice(item){
  try {
    const hasBrand=!!(item.brand&&item.brand.trim());
    const hasSize=!!(item.size&&item.size.trim());
    const itemDesc=[item.brand,item.name,item.size].filter(Boolean).join(' ');
    const brandLine=hasBrand
      ? `IMPORTANT: Must be "${item.brand}" brand specifically. If not found, return found:false.`
      : `Any brand is fine — return the cheapest option.`;

    const prompt=`Search walmart.com for the current grocery price of "${itemDesc}".
${brandLine}
Search query to use: site:walmart.com "${item.name}"${hasSize?' "'+item.size+'"':''}${hasBrand?' "'+item.brand+'"':''}

Find a specific dollar amount from the search results. Return ONLY this JSON, nothing else:
{"store":"Walmart","price_per_unit":"X.XX","found":true}
If no price found: {"store":"Walmart","price_per_unit":null,"found":false}`;

    const res=await fetch('/.netlify/functions/claude',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:300,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    if(data.error) throw new Error(data.error.message);
    const rawText=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    logError('Walmart raw response', rawText);
    const s=rawText.indexOf('{'), e=rawText.lastIndexOf('}');
    if(s===-1||e===-1) return {store:'Walmart',price:null,found:false};
    const r=JSON.parse(rawText.slice(s,e+1));
    return {store:'Walmart',price:r.price_per_unit||null,found:!!r.found};
  } catch(err){
    logError('Walmart price error',err.message);
    return {store:'Walmart',price:null,found:false,error:err.message};
  }
}

// --- Main price check orchestrator ---
async function runPriceCheck(item, itemId){
  priceItemRef=item; priceItemId=itemId||null; priceLoading=true; priceRows=[]; priceSelIdx=null;
  showPriceModal();
  try {
    // Run Kroger + Walmart in parallel
    const [kroger, walmart]=await Promise.all([getKrogerPrice(item), getWalmartPrice(item)]);
    priceRows=[
      {raw:'Kroger',  canonical:'Kroger',  price:kroger.price,  found:kroger.found,  brandNotFound:kroger.brandNotFound,  error:kroger.error},
      {raw:'Walmart', canonical:'Walmart', price:walmart.price, found:walmart.found, error:walmart.error}
    ];
  } catch(err){
    logError('Price check failed',err.message);
    priceRows=[{error:err.message}];
  }
  priceLoading=false; renderPriceModal();
}

async function importItems(items){
  for(const it of items){
    const name=it.Name||it.name||''; if(!name) continue;
    const brand=it.Brand||it.brand||'', size=it.Size||it.size||'';
    const qty=it.Qty||it.qty||it.Quantity||it.quantity||'1';
    const price=it.Price||it.price||'';
    const taxed=(it.Taxable||it.taxable||'false').toLowerCase()==='true';
    const dup=groceries.find(g=>g.name.toLowerCase()===name.toLowerCase()&&(g.brand||'').toLowerCase()===brand.toLowerCase()&&(g.size||'').toLowerCase()===size.toLowerCase()&&!g.is_bought);
    if(dup){
      const merge=await new Promise(res=>{ mergeRes=res; showMergeModal(name,brand,size,qty,dup); });
      if(merge){
        const nq=(parseQty(dup.quantity)+parseQty(qty)).toString();
        const {error}=await sb.from('grocery_items').update({quantity:nq}).eq('id',dup.id);
        if(error) logError('Merge qty failed',error.message); else dup.quantity=nq;
        continue;
      }
    }
    const {data:row,error}=await sb.from('grocery_items').insert({name,brand,size,quantity:qty,price,is_taxed:taxed,store:'Unassigned',department:'Unassigned',is_bought:false}).select().single();
    if(error) logError('CSV import row failed',error.message); else if(row) groceries.push(row);
  }
  syncStores(); render();
}

function showPriceModal(){
  closeModal('priceOv');
  const ov=document.createElement('div'); ov.className='mov'; ov.id='priceOv'; ov.style.zIndex=110;
  ov.onclick=e=>{ if(e.target===ov&&!priceLoading) closeModal('priceOv'); };
  const d=document.createElement('div'); d.className='mdlg'; d.id='priceD';
  ov.appendChild(d); document.body.appendChild(ov); renderPriceModal();
}

function renderPriceModal(){
  const d=document.getElementById('priceD'); if(!d) return;
  const item=priceItemRef;
  const subParts=[item?.brand,item?.size].filter(Boolean).join(' · ');
  const hdr=`<div class="mhdr"><div style="display:flex;align-items:center;gap:10px"><div style="background:#f0fdf4;padding:8px;border-radius:10px;color:#16a34a;display:flex">${IC.dollar_lg}</div><h2 class="mtitle">Price Comparison</h2></div>`;

  if(priceLoading){
    d.innerHTML=`${hdr}</div>
      ${item?`<div class="price-nm">${esc(item.name)}</div>${subParts?`<div class="price-sub">${esc(subParts)}</div>`:''}` :''}
      <div class="price-loading"><div class="spinner"></div><div>Checking Kroger &amp; Walmart prices...</div></div>`;
    return;
  }

  const closeBtn=`<button class="mclose" onclick="closeModal('priceOv')">${IC.x}</button>`;

  if(priceRows[0]?.error){
    d.innerHTML=`${hdr}${closeBtn}</div>
      <div class="price-error"><strong>Something went wrong</strong>${esc(priceRows[0].error)}</div>
      <button class="btn-primary" style="margin-top:14px" onclick="closeModal('priceOv')">Close</button>`;
    return;
  }

  const allNotFound=priceRows.length>0&&priceRows.every(r=>!r.found);
  if(allNotFound&&item?.brand){
    d.innerHTML=`${hdr}${closeBtn}</div>
      <div class="price-nm">${esc(item.name)}</div>
      <div class="price-error"><strong>Brand Not Found</strong>"${esc(item.brand)}" was not found at Kroger, Walmart, or Whole Foods. Try removing the brand and searching again.</div>
      <button class="btn-primary" style="margin-top:14px" onclick="closeModal('priceOv')">Got it</button>`;
    return;
  }

  const foundRows=priceRows.filter(r=>r.found&&r.price);
  const bestPrice=foundRows.length?Math.min(...foundRows.map(r=>parseFloat(r.price))):null;

  const rowsHtml=priceRows.map((r,i)=>{
    const label=r.canonical||r.raw||'Unknown';
    if(!r.found||!r.price) return `<div class="price-row unavail"><div><div class="pr-store">${esc(label)}</div><div class="pr-avail">Not available</div></div><div class="pr-right"><div class="pr-na">—</div></div></div>`;
    const isBest=parseFloat(r.price)===bestPrice;
    return `<div class="price-row ${priceSelIdx===i?'selected':''}" onclick="selectPriceRow(${i})">
      <div><div class="pr-store">${esc(label)}</div>${!r.canonical?'<div class="pr-avail" style="color:#f59e0b">⚠ Tap to confirm store</div>':''}</div>
      <div class="pr-right"><div class="pr-price">$${parseFloat(r.price).toFixed(2)}</div>${isBest?'<div class="pr-best">Best Price</div>':''}</div>
    </div>`;
  }).join('');

  d.innerHTML=`${hdr}${closeBtn}</div>
    <div class="price-nm">${esc(item?.name||'')}</div>
    ${subParts?`<div class="price-sub">${esc(subParts)} · per unit</div>`:'<div class="price-sub">per unit</div>'}
    <div class="price-rows">${rowsHtml}</div>
    <div class="brow">
      <button class="btn-sec" onclick="closeModal('priceOv')">Cancel</button>
      <button class="btn-primary" style="flex:1;margin-top:0" onclick="applySelectedPrice()" ${priceSelIdx===null?'disabled':''}>Apply to Form</button>
    </div>`;
}

function selectPriceRow(i){ priceSelIdx=i; renderPriceModal(); }

function applySelectedPrice(){
  if(priceSelIdx===null) return;
  const row=priceRows[priceSelIdx];
  if(!row?.price) return;
  const price=parseFloat(row.price).toFixed(2);
  if(row.canonical){ fillPriceIntoForm(row.canonical, price); }
  else { showStoreResolver(row.raw, price); }
}

function fillPriceIntoForm(store, price){
  closeModal('priceOv');
  const prEl=document.getElementById('gpr');
  const stEl=document.getElementById('gst');
  if(prEl && stEl){
    // Grocery modal is open — fill fields directly
    prEl.value=price;
    const opt=Array.from(stEl.options).find(o=>o.value===store);
    if(opt){ stEl.value=store; const csg=document.getElementById('csg'); if(csg) csg.style.display='none'; }
  } else if(priceItemId){
    // Called from list view — save directly to DB
    const g=groceries.find(x=>x.id===priceItemId);
    if(g) saveGrocery({...g,id:priceItemId,price,store});
  }
}

    <div class="mhdr"><h2 class="mtitle">Review Import (${items.length} items)</h2><button class="mclose" onclick="closeModal('csvOv')">${IC.x}</button></div>
    <div class="csv-list">${items.map(it=>`<div class="csv-item"><div><div class="csv-nm">${esc(it.Name||it.name||'—')}</div><div class="csv-meta">${esc(it.Brand||it.brand||'No Brand')} · ${esc(it.Size||it.size||'No Size')} · Qty: ${esc(it.Qty||it.qty||it.Quantity||it.quantity||'1')}</div></div>${(it.Price||it.price)?`<div class="csv-price">$${it.Price||it.price}</div>`:''}</div>`).join('')}</div>
    <div class="brow"><button class="btn-sec" onclick="closeModal('csvOv')">Cancel</button><button class="btn-primary" style="flex:1;margin-top:0" onclick="confirmImport()">Import All</button></div>`;
  ov.appendChild(d); document.body.appendChild(ov); csvPending=items;
}
async function confirmImport(){ const items=csvPending; closeModal('csvOv'); csvPending=[]; await importItems(items); }

// ============================================================
//  RENDER
// ============================================================
function render(){
  const filtered=chores.filter(c=>c.person===person&&c.due_date===selDate);
  const sortedSt=[...stores].sort((a,b)=>a==='Unassigned'?1:b==='Unassigned'?-1:a.localeCompare(b));
  document.getElementById('app').innerHTML=`
    <header class="hdr">
      <div class="hdr-top">
        <div onclick="showDebugPanel()" style="cursor:pointer">
          <div class="logo">BissHiz</div>
          <div class="logo-sub">${view==='chores'?'Chore List':'Groceries'}</div>
        </div>
        <button class="btn-add" onclick="openAdd()">${IC.plus}</button>
      </div>
      <div class="view-toggle">
        <button class="vtab ${view==='chores'?'active':''}" onclick="setView('chores')">${IC.clock} Chores</button>
        <button class="vtab ${view==='groceries'?'active':''}" onclick="setView('groceries')">${IC.cart} Groceries</button>
      </div>
    </header>
    <main>
      ${renderWeather()}
      ${view==='chores'?renderChores(filtered):renderGroceries(sortedSt)}
    </main>
    ${view==='chores'?renderBNav():''}
  `;
  const csv=document.getElementById('csvInput');
  if(csv) csv.onchange=e=>{ const f=e.target.files[0]; if(!f) return; Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>{csv.value='';showCSVPreview(r.data);}}); };
}

function renderWeather(){
  return `<div class="weather"><div class="w-left"><div><div class="w-icon">${WEATHER.icon}</div><div class="w-fc">${WEATHER.forecast.map(f=>`<div class="w-fc-day"><div class="w-fc-ico">${f.icon}</div><div class="w-fc-lbl">${f.day}</div></div>`).join('')}</div></div><div><div class="w-temp">${WEATHER.temp}°</div><div class="w-cond">${WEATHER.cond}</div></div></div><div class="w-loc"><div class="w-zip">75407</div><div class="w-city">Princeton, TX</div></div></div>`;
}

function renderChores(filtered){
  return `
    <div class="date-nav">
      <button class="dnbtn" onclick="changeDate(-1)">${IC.chevL}</button>
      <div class="dn-lbl">${IC.calendar}${dateLabel(selDate)}</div>
      <button class="dnbtn" onclick="changeDate(1)">${IC.chevR}</button>
    </div>
    <div class="chore-list">
      ${filtered.length===0
        ?`<div class="empty"><div class="empty-ico">${IC.check_ico}</div><div class="empty-lbl">No chores for this day!</div></div>`
        :filtered.map(renderChoreCard).join('')}
    </div>`;
}

function renderChoreCard(c){
  const done=c.is_completed, hasRep=c.repetition_type&&c.repetition_type!=='none';
  return `<div class="ccard ${done?'done':''}">
    <button class="tog ${done?'checked':''}" onclick="toggleChore('${c.id}')">${done?IC.check:IC.circle}</button>
    <div class="cbody">
      <div class="ctitle ${done?'struck':''}">${esc(c.title)}</div>
      ${c.description?`<div class="cdesc">${esc(c.description)}</div>`:''}
      ${hasRep?`<div class="rep-badge">${IC.repeat}${repLabel(c.repetition_type,c.repetition_value)}</div>`:''}
    </div>
    <div class="cacts">
      <button class="ibtn edit" onclick="openEditChore('${c.id}')">${IC.edit}</button>
      <button class="ibtn del" onclick="deleteChore('${c.id}')">${IC.trash}</button>
    </div>
  </div>`;
}

function renderGroceries(sortedSt){
  const hasBought=groceries.some(i=>i.is_bought);
  const grouped={};
  sortedSt.forEach(s=>{ const si=groceries.filter(i=>i.store===s); if(!si.length) return; grouped[s]={}; DEPARTMENTS.forEach(d=>{ const di=si.filter(i=>i.department===d); if(di.length) grouped[s][d]=di; }); });
  return `
    <div class="g-tabs">
      <button class="gtab ${gSub==='list'?'active':''}" onclick="setGSub('list')">My List</button>
      <button class="gtab ${gSub==='favorites'?'active':''}" onclick="setGSub('favorites')">Favorites</button>
    </div>
    ${gSub==='list'?`
      <div class="g-ctrl">
        <button class="cbtn imp" onclick="document.getElementById('csvInput').click()">${IC.plus_sm} Import CSV</button>
        ${hasBought?`<button class="cbtn clr" onclick="clearBought()">${IC.trash_sm} Clear Done</button>`:''}
      </div>
      ${groceries.length===0
        ?`<div class="empty"><div class="empty-ico">${IC.cart}</div><div class="empty-lbl">Your grocery list is empty!</div></div>`
        :Object.entries(grouped).map(([s,d])=>renderStore(s,d)).join('')}
    `:renderFavs()}`;
}

function renderStore(store,depts){
  let sub=0,tax=0;
  Object.values(depts).forEach(items=>items.forEach(i=>{ if(!i.is_bought){ const p=parsePrice(i.price)*parseQty(i.quantity); sub+=p; if(i.is_taxed) tax+=p*TAX_RATE; } }));
  return `<div class="store-sec">
    <div class="store-hdr">
      <div class="store-left">${IC.store}<span class="store-nm">${esc(store)}</span></div>
      ${sub>0?`<div class="store-tot">$${sub.toFixed(2)} + $${tax.toFixed(2)} = <span class="tot">$${(sub+tax).toFixed(2)}</span></div>`:''}
    </div>
    ${Object.entries(depts).map(([dept,items])=>`
      <div class="dept-sec">
        <div class="dept-hdr">${IC.tag}<span class="dept-nm">${dept}</span></div>
        ${items.map(renderGCard).join('')}
      </div>`).join('')}
  </div>`;
}

function renderGCard(item){
  const isFav=favs.some(f=>f.name===item.name&&f.brand===item.brand&&f.size===item.size);
  const qty=parseQty(item.quantity), price=parsePrice(item.price);
  const priceStr=!item.is_bought&&price>0?(qty>1?`$${price.toFixed(2)} ea · $${(price*qty).toFixed(2)} total`:`$${price.toFixed(2)}`):'' ;
  return `<div class="gcrd ${item.is_bought?'bought':''}">
    <button class="tog ${item.is_bought?'checked':''}" onclick="toggleGrocery('${item.id}')">${item.is_bought?IC.check_sm:IC.circle_sm}</button>
    <div class="cbody">
      <div class="gn ${item.is_bought?'struck':''}">${item.brand?`<span class="gbr">${esc(item.brand)}</span> `:''}${esc(item.name)}${item.size?` <span class="gsz">(${esc(item.size)})</span>`:''}</div>
      <div class="gmeta">
        ${item.quantity?`<div class="gqty"><b>Qty:</b>${esc(item.quantity)}</div>`:''}
        ${priceStr?`<div class="pbadge">${priceStr}</div>`:''}
        ${item.is_taxed&&!item.is_bought?`<div class="taxlbl">Taxable</div>`:''}
      </div>
    </div>
    <div class="cacts">
      <button class="ibtn heart ${isFav?'on':''}" onclick="toggleFavById('${item.id}')">${IC.heart}</button>
      <button class="ibtn price" onclick="runPriceById('${item.id}')">${IC.dollar}</button>
      <button class="ibtn edit" onclick="openEditGrocery('${item.id}')">${IC.edit}</button>
      <button class="ibtn del" onclick="deleteGrocery('${item.id}')">${IC.trash}</button>
    </div>
  </div>`;
}

function renderFavs(){
  if(!favs.length) return `<div class="empty"><div class="empty-ico">${IC.heart}</div><div class="empty-lbl">No favorites yet!</div><div class="empty-sub">Heart items in your list to save them here.</div></div>`;
  return favs.map(f=>`<div class="fav-crd">
    <div class="cbody">
      <div class="gn">${f.brand?`<span class="gbr">${esc(f.brand)}</span> `:''}${esc(f.name)}${f.size?` <span class="gsz">(${esc(f.size)})</span>`:''}</div>
      <div class="gmeta">${f.quantity?`<div class="gqty"><b>Qty:</b>${esc(f.quantity)}</div>`:''} ${f.price?`<div class="pbadge">$${parsePrice(f.price).toFixed(2)}</div>`:''} ${f.is_taxed?`<div class="taxlbl">Taxable</div>`:''}</div>
      <div class="fav-sd">${esc(f.store)} · ${esc(f.department)}</div>
    </div>
    <div class="fav-acts">
      <button class="btn-unfav" onclick="toggleFavDirect('${f.id}')">${IC.heart_lg}</button>
      <button class="btn-addfav" onclick="addFavToListById('${f.id}')">${IC.plus_sm}</button>
    </div>
  </div>`).join('');
}

function renderBNav(){
  const navIcons={'Dad':IC.dad,'Honey-do':IC.honeyd,'Mom':IC.mom};
  return `<nav class="bnav">${PEOPLE.map(p=>`<button class="nbtn ${p===person?'active':''}" onclick="setPerson('${p}')">${navIcons[p]}${p}</button>`).join('')}</nav>`;
}

// ============================================================
//  ACTIONS
// ============================================================
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setView(v){ view=v; render(); }
function setGSub(v){ gSub=v; render(); }
function setPerson(p){ person=p; render(); }
function changeDate(n){ selDate=shiftDate(selDate,n); render(); }
function openAdd(){ view==='chores'?openChoreModal(null):openGroceryModal(null); }
function openEditChore(id){ const c=chores.find(x=>x.id===id); if(c) openChoreModal(c); }
function openEditGrocery(id){ const g=groceries.find(x=>x.id===id); if(g) openGroceryModal(g); }
function toggleFavById(id){ const g=groceries.find(x=>x.id===id); if(g) toggleFav(g); }
function toggleFavDirect(id){ const f=favs.find(x=>x.id===id); if(f) toggleFav(f); }
function addFavToListById(id){ const f=favs.find(x=>x.id===id); if(f) addFavToList(f); }
function runPriceById(id){ const g=groceries.find(x=>x.id===id); if(g) runPriceCheck(g, id); }

// ============================================================
//  REALTIME
// ============================================================
function setupRealtime(){
  try {
    sb.channel('app')
      .on('postgres_changes',{event:'*',schema:'public',table:'chores'},loadAll)
      .on('postgres_changes',{event:'*',schema:'public',table:'grocery_items'},loadAll)
      .on('postgres_changes',{event:'*',schema:'public',table:'favorite_items'},loadAll)
      .subscribe((status,err)=>{
        if(err) logError('Realtime error',err.message||String(err));
      });
  } catch(err){
    logError('Realtime setup failed (non-critical)',err.message);
  }
}

// ============================================================
//  INIT
// ============================================================
loadAll().then(setupRealtime);
</script>
</body>
</html>
